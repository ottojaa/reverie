services:
    backend:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                VITE_API_URL: https://api.reverieapp.dev
                # PaddleOCR/CUDA now live in the reverie-ocr-base image (built by
                # scripts/deploy.sh, referenced via the OCR_BASE build arg — default
                # reverie-ocr-base:latest). GPU vs CPU is chosen when that base is
                # built (OCR_GPU in deploy.sh), not here.
        container_name: reverie-backend
        # env_file is an absolute path so it works regardless of where
        # docker compose is invoked from (CI runner checkout dir vs /opt/reverie)
        env_file:
            - /opt/reverie/.env.production
        environment:
            # Expose the host GPU to PaddleOCR. 'compute' is required for CUDA/cuDNN;
            # without it CUDA init silently fails on this non-NVIDIA base image.
            # Set OCR_DEVICE=gpu:0 in /opt/reverie/.env.production to actually use it.
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
            # The in-app agent container. The backend generates the shared secret file on first use and keeps
            # working (the agent shows as unavailable) when the agent container is down. No depends_on on purpose.
            - AGENT_URL=http://reverie-agent:8080
            - AGENT_SECRET_FILE=/run/reverie-agent/secret
            # Embeddings run in reverie-ml. The backend keeps working (and OCR keeps running) when it is down.
            - ML_URL=http://reverie-ml:8090
            # PaddleOCR shares the 10 GB card with reverie-ml. auto_growth stops Paddle from grabbing a fixed
            # fraction up front, and the limit is a hard ceiling on what it may ever allocate. See the VRAM
            # budget in apps/reverie-ml/README.md before changing either.
            - FLAGS_allocator_strategy=auto_growth
            - FLAGS_gpu_memory_limit_mb=4096
        ports:
            # Bind to loopback only — nginx on the host proxies to this port
            - '127.0.0.1:3000:3000'
        volumes:
            # Mount NAS storage so backend can read/write user files
            - /mnt/nas/reverie:/mnt/nas/reverie
            # Persist PaddleOCR PP-OCRv5 models (~210MB, HOME=/root -> ~/.paddlex) so they
            # download once and survive container recreates. Models are NOT baked into the
            # image because importing the GPU paddle wheel needs libcuda.so.1 at build time.
            - ocr_models:/root/.paddlex
            - agent_secret:/run/reverie-agent
        # Reserve the NVIDIA GPU (requires NVIDIA Container Toolkit on the host).
        # `gpus: all` is a cleaner alternative on Compose >= v2.30.
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Stock Claude Code behind a small wrapper (apps/agent). Deliberately has no Docker socket, no library/NAS
    # volume and no database credentials: it reaches Reverie only through the backend's /mcp with a short-lived
    # token the backend sends per request. Sign in once: see "In-app agent" in the README.
    reverie-agent:
        build:
            context: apps/agent
        container_name: reverie-agent
        environment:
            - REVERIE_MCP_URL=http://backend:3000/mcp
        volumes:
            # The Claude login, config and chat transcripts.
            - agent_claude:/data/claude
            # Shared secret, generated by the backend; read-only here.
            - agent_secret:/run/reverie-agent:ro
        restart: unless-stopped

    # Postgres with pgvector, still Alpine/musl so the existing data directory keeps its collation.
    postgres:
        build:
            context: docker/postgres
        image: reverie-postgres:16.16-pgvector0.8.1
        container_name: reverie-postgres
        ports:
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            # POSTGRES_PASSWORD is read from the runner environment,
            # which is populated via --env-file /opt/reverie/.env.production
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U reverie']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # Local embedding models (text + image) on the same GPU. Reachable on the compose network only: no published
    # port, and no library/NAS volume, because the backend sends the bytes it wants embedded.
    reverie-ml:
        build:
            context: apps/reverie-ml
        image: reverie-ml:latest
        container_name: reverie-ml
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=compute,utility
        volumes:
            # Hugging Face weights (a few GB): downloaded once, kept across container recreates.
            - ml_models:/models
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        # Liveness only: the port answers while weights are still downloading (ready=false on /health).
        healthcheck:
            test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4)"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: reverie-redis
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
    redis_data:
    ocr_models:
    ml_models:
    agent_claude:
    agent_secret:
