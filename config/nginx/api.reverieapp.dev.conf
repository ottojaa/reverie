# Nginx config for api.reverieapp.dev
#
# Handles:
#   - API proxy to backend container on :3000 (including WebSocket / Socket.IO)
#   - Secure file serving via nginx secure_link (signed URLs from backend)
#
# Prerequisites:
#   - nginx compiled with ngx_http_secure_link_module (default on Ubuntu/Debian)
#   - FILE_URL_SECRET in .env.production must match $secure_link_secret below
#
# Installation:
#   sudo cp api.reverieapp.dev.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/api.reverieapp.dev.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.reverieapp.dev   # adds SSL automatically

upstream reverie_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.reverieapp.dev;

    # Max upload size per request. Keep in sync with MAX_UPLOAD_FILE_SIZE_BYTES (libs/shared/src/helpers/upload.ts);
    # the app enforces the exact per-file limit and returns a descriptive error.
    client_max_body_size 20G;

    # Secure file serving with signed URLs
    # URL format: /files/{path}?e={expires}&s={signature}
    location /files/ {
        # IMPORTANT: Must match FILE_URL_SECRET in .env.production exactly
        set $secure_link_secret "CHANGE_ME_MATCH_FILE_URL_SECRET";

        # Verify signature: md5(expires + uri + secret) encoded as base64url
        secure_link $arg_s,$arg_e;
        secure_link_md5 "$arg_e$uri$secure_link_secret";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }

        # Strip /files/ prefix and serve directly from NAS storage root
        alias /mnt/nas/reverie/;

        # Force a download (attachment) only when ?download=1 is present; otherwise the
        # header value is empty and nginx omits it, so files still render inline in the
        # viewer. `dl` carries the RFC 5987 percent-encoded original filename ($arg_* is
        # not URL-decoded by nginx, which matches encodeURIComponent on the client).
        # `if` here only runs `set` (a safe use) and the add_header stays at location level.
        set $reverie_content_disposition "";
        if ($arg_download = "1") {
            set $reverie_content_disposition "attachment; filename*=UTF-8''$arg_dl";
        }
        add_header Content-Disposition $reverie_content_disposition always;

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Cache-Control "private, max-age=86400, immutable";

        # CORS: hardcoded so it works when CDN/proxy strips Origin header
        add_header Access-Control-Allow-Origin "https://www.reverieapp.dev" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.reverieapp.dev";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age 86400;
            return 204;
        }

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;

        gzip on;
        gzip_types text/plain application/json application/javascript text/css;
    }

    # HLS renditions of videos (transcode/<content hash>/ under the storage root).
    # URL format: /files/hls/{expires}/{signature}/{content hash}/{path inside the set}
    # The token sits in the path, not the query string: a playlist's segment URLs are relative, so they resolve under
    # the same token, and one signature covers the whole set. The signature is md5("{expires}/hls/{hash}{secret}") as
    # base64url (apps/backend/src/storage/hls-token.ts). Every playlist and segment is plain static files, served by nginx.
    # Each path segment must start with a letter, digit, "_" or "-": no "..", no dotfiles.
    location ~ "^/files/hls/(?<exp>\d+)/(?<sig>[A-Za-z0-9_-]+)/(?<key>[0-9a-f]{64})/(?<rest>(?:[A-Za-z0-9_-][A-Za-z0-9_.-]*/)*[A-Za-z0-9_-][A-Za-z0-9_.-]*)$" {
        # IMPORTANT: Must match FILE_URL_SECRET in .env.production exactly
        set $secure_link_secret "CHANGE_ME_MATCH_FILE_URL_SECRET";

        secure_link $sig,$exp;
        secure_link_md5 "$exp/hls/$key$secure_link_secret";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }

        alias /mnt/nas/reverie/transcode/$key/$rest;

        # nginx's default types lack .m4s (the fMP4 segments)
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp4 mp4 m4s;
        }

        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Cache-Control "private, max-age=86400, immutable";

        # CORS for hls.js (XHR): the web app's origin, or "null" (the packaged Electron app loads from file://).
        # Anything else gets the web origin back, which its browser rejects. Hardcoded like the /files/ location,
        # so it also works when a CDN/proxy strips the Origin header.
        set $reverie_hls_origin "https://www.reverieapp.dev";
        if ($http_origin = "null") {
            set $reverie_hls_origin "null";
        }
        add_header Access-Control-Allow-Origin $reverie_hls_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $reverie_hls_origin;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Range";
            add_header Access-Control-Max-Age 86400;
            add_header Vary "Origin";
            return 204;
        }

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # All other requests (including Socket.IO) proxy to the backend container
    location / {
        proxy_pass http://reverie_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Socket.IO upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Stream uploads straight to the backend instead of buffering the whole body (up to 20 GB) on
        # nginx's disk first. The backend streams to storage, so progress and errors reach the client live.
        proxy_request_buffering off;

        # Extended timeouts for long-running OCR/LLM requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
