version: '3.8'

services:
    # Postgres with pgvector (still Alpine/musl). Same Dockerfile as production.
    postgres:
        build:
            context: docker/postgres
        image: reverie-postgres:16.16-pgvector0.8.1
        container_name: reverie-postgres
        environment:
            POSTGRES_USER: reverie
            POSTGRES_PASSWORD: reverie
            POSTGRES_DB: reverie
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U reverie']
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: reverie-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5

    # The in-app agent (stock Claude Code behind apps/agent). In dev the backend runs on the host, so the agent
    # reaches it through host.docker.internal and the backend reaches the agent on a loopback port.
    # Dev backend env: AGENT_URL=http://127.0.0.1:8080 and AGENT_SECRET=<any 16+ char string> (also set below).
    reverie-agent:
        build:
            context: apps/agent
        container_name: reverie-agent
        environment:
            - REVERIE_MCP_URL=http://host.docker.internal:3000/mcp
            - AGENT_SECRET=${AGENT_SECRET:-reverie-dev-agent-secret}
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:8080:8080'
        volumes:
            - agent_claude:/data/claude

    # Local embedding models, CPU by default. The backend runs on the host, so the port is published on loopback:
    # set ML_URL=http://127.0.0.1:8090 in the dev backend env. On an NVIDIA machine add the GPU override:
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    reverie-ml:
        build:
            context: apps/reverie-ml
        image: reverie-ml:latest
        container_name: reverie-ml
        ports:
            - '127.0.0.1:8090:8090'
        volumes:
            - ml_models:/models

volumes:
    agent_claude:
    ml_models:
    postgres_data:
    redis_data:
